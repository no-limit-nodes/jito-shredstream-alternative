# Add to /etc/nftables.conf inside your inet filter table, then: sudo nft -f /etc/nftables.conf
# Replace 20000 with your shred port. To restrict sources, use:
#   ip saddr { 1.2.3.4, 5.6.7.8 } udp dport 20000 accept
table inet filter {
  chain input {
    udp dport 20000 accept comment "shred feed"
  }
}
