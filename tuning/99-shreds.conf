# Larger UDP receive buffers so bursts of shreds are not dropped by the kernel.
# Install: sudo cp tuning/99-shreds.conf /etc/sysctl.d/ && sudo sysctl --system
# Check drops: netstat -su | grep -i "receive buffer errors"
net.core.rmem_max = 134217728
net.core.rmem_default = 134217728
net.core.netdev_max_backlog = 50000
